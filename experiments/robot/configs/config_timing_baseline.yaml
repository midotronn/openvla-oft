# Timing run: Baseline (no pruning)
# Run just 2 tasks x 10 episodes for timing comparison

model_path: "moojink/openvla-7b-oft-finetuned-libero-spatial"
model_family: "openvla"
pretrained_checkpoint: null

task_suite_name: "libero_spatial"
task_id: 0-1
num_episodes: 10
center_crop: true

# No pruning
use_sam: false

# No biasing
use_attention_bias: false

# No OOD perturbation
ood_enabled: false

# Action head
use_diffusion: false
use_proprio: true
use_film: false

# Logging
save_visualizations: false
output_dir: "./eval_results/timing_baseline"
rollout_dir: "./rollouts/timing_baseline"
seed: 7

# SAM params (not used since use_sam=false, but script requires them)
top_k_points: 8
num_neg_points: 3
mask_to_patch_threshold: 0.3
