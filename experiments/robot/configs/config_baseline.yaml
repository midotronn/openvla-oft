# Baseline: Vanilla OpenVLA-OFT (no pruning, no attention biasing)
# Expected: ~97% success rate on libero_spatial (10 tasks x 10 episodes)

model_path: "moojink/openvla-7b-oft-finetuned-libero-spatial"
model_family: "openvla"
pretrained_checkpoint: null

task_suite_name: "libero_spatial"
task_id: 0-9
num_episodes: 10
center_crop: true

# SAM/EfficientTAM — DISABLED
use_sam: false

# Attention biasing — DISABLED
use_attention_bias: false

# No OOD perturbation
ood_enabled: false

# Action head
use_diffusion: false
use_proprio: true
use_film: false

# Logging
save_visualizations: false
output_dir: "./eval_results/baseline"
rollout_dir: "./rollouts/baseline"
seed: 7
